name: Release Build

on:
  push:
    tags:
      - "v*"  # Trigger on version tags like v0.6.2.5

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.6.3.0)"
        required: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Run tests first - fail fast before building
  # ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r src/requirements.txt
          pip install pytest pypdf
      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # macOS Build
  # ──────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r src/requirements.txt
          pip install pyinstaller rumps

      - name: Stamp a beta build with its tag
        # Only a pushed beta tag: a hand-started build of a branch like
        # wip/3d-for-1-7 has a '-' too, and must not name itself after it.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        # The app reads BUILD_TAG.txt (updater.get_current_version) so a beta
        # names itself "1.5.3-beta.1" and is offered the full 1.5.3.
        run: echo "${GITHUB_REF_NAME#v}" > src/BUILD_TAG.txt

      - name: Build app
        run: |
          source .venv/bin/activate
          cd src && python -m PyInstaller led_raster_designer.spec --noconfirm
          cp -R "dist/LED Raster Designer.app" "../LED Raster Designer.app"

      - name: Smoke test frozen app
        run: |
          # Launch the actual frozen binary in server-only mode and probe it.
          # Validates the bundle end-to-end: entry point, blueprints, datas.
          export LRD_NO_WINDOW=1 LRD_SMOKE_PORT=18750
          "./LED Raster Designer.app/Contents/MacOS/LED Raster Designer" &
          APP_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:18750/api/version > /dev/null; then break; fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "frozen app exited early"; exit 1
            fi
          done
          curl -sf http://127.0.0.1:18750/api/version
          curl -sf -o /dev/null -w "GUI: %{http_code}\n" http://127.0.0.1:18750/
          curl -sf http://127.0.0.1:18750/api/project > /dev/null && echo "project API: ok"
          curl -sf http://127.0.0.1:18750/api/panel-catalog/info > /dev/null && echo "catalog API: ok"
          kill $APP_PID

      # ── Code Signing (requires Apple Developer cert in secrets) ──
      - name: Import code signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Sign app bundle
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --sign "$SIGNING_IDENTITY" \
            --options runtime \
            --entitlements /dev/null \
            "LED Raster Designer.app"

      - name: Notarize app
        if: env.MACOS_NOTARIZE_APPLE_ID != ''
        env:
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent "LED Raster Designer.app" "LRD-notarize.zip"
          xcrun notarytool submit "LRD-notarize.zip" \
            --apple-id "$MACOS_NOTARIZE_APPLE_ID" \
            --password "$MACOS_NOTARIZE_PASSWORD" \
            --team-id "$MACOS_NOTARIZE_TEAM_ID" \
            --wait
          xcrun stapler staple "LED Raster Designer.app"

      - name: Create release DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          DMG="led_raster_designer_v${VERSION}_macos.dmg"
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install create-dmg
          # The DMG window is 600x400 points. Finder does NOT scale a plain
          # background image, so it must match the window size (a 1200x800 PNG
          # would show only its top-left quarter). For Retina crispness we fold
          # the 600x400 (1x) and 1200x800 (2x) PNGs into a single hi-dpi TIFF
          # via tiffutil; if that fails we fall back to the 1x PNG, which is
          # already the correct on-screen size.
          BG="build/dmg-background.png"
          if tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png -out build/dmg-background.tiff; then
            BG="build/dmg-background.tiff"
          fi
          echo "Using DMG background: $BG"
          # create-dmg can exit non-zero on CI when the Finder AppleScript
          # styling step is flaky, yet still produce a valid DMG — so we retry
          # and finally accept any DMG that exists.
          for attempt in 1 2 3; do
            rm -f "$DMG"
            create-dmg \
              --volname "LED Raster Designer" \
              --background "$BG" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 120 \
              --icon "LED Raster Designer.app" 150 210 \
              --app-drop-link 450 210 \
              --hide-extension "LED Raster Designer.app" \
              --no-internet-enable \
              "$DMG" \
              "LED Raster Designer.app" && break
            echo "create-dmg attempt $attempt returned non-zero; checking for output..."
            [ -f "$DMG" ] && { echo "DMG produced despite warning."; break; }
            sleep 5
          done
          test -f "$DMG"
          # If the app was notarized above, notarize + staple the DMG too so it
          # passes Gatekeeper on first open. Skipped when no notarize secrets.
          if [ -n "${{ secrets.MACOS_NOTARIZE_APPLE_ID }}" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "${{ secrets.MACOS_NOTARIZE_APPLE_ID }}" \
              --password "${{ secrets.MACOS_NOTARIZE_PASSWORD }}" \
              --team-id "${{ secrets.MACOS_NOTARIZE_TEAM_ID }}" \
              --wait || echo "DMG notarization failed (app inside is already notarized)."
            xcrun stapler staple "$DMG" || echo "DMG staple skipped."
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: led_raster_designer_v*_macos.dmg

  # ──────────────────────────────────────────────
  # Windows Build
  # ──────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -r src/requirements.txt
          pip install pyinstaller pystray

      - name: Stamp a beta build with its tag
        # Only a pushed beta tag: a hand-started build of a branch like
        # wip/3d-for-1-7 has a '-' too, and must not name itself after it.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        run: Set-Content -Path src\BUILD_TAG.txt -Value ("$env:GITHUB_REF_NAME" -replace '^v','') -NoNewline -Encoding utf8

      - name: Build executable
        run: |
          .venv\Scripts\Activate.ps1
          cd src
          python -m PyInstaller led_raster_designer.spec --noconfirm
          Copy-Item -Recurse -Force "dist\LED Raster Designer" "..\LED Raster Designer App"

      - name: Smoke test frozen app
        run: |
          # Launch the actual frozen binary in server-only mode and probe it.
          # Validates the bundle end-to-end: entry point, blueprints, datas.
          $env:LRD_NO_WINDOW = "1"
          $env:LRD_SMOKE_PORT = "18750"
          $proc = Start-Process -FilePath "LED Raster Designer App\LED Raster Designer.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18750/api/version" -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($proc.HasExited) { Write-Error "frozen app exited early"; exit 1 }
          }
          if (-not $ok) { Write-Error "server never came up"; Stop-Process -Id $proc.Id -Force; exit 1 }
          Write-Host "version: $((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18750/api/version').Content)"
          $gui = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18750/"
          Write-Host "GUI: $($gui.StatusCode)"
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18750/api/project" | Out-Null; Write-Host "project API: ok"
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18750/api/panel-catalog/info" | Out-Null; Write-Host "catalog API: ok"
          Stop-Process -Id $proc.Id -Force

      # ── The .NET backend, and whether Mark of the Web breaks it ──
      #
      # The smoke test above runs with LRD_NO_WINDOW, which returns BEFORE the
      # native window is built - so a completely broken .NET path shipped green
      # for the whole life of this workflow. A user hit exactly that: the
      # window failed, the app fell back to a browser, and diagnosing it cost
      # two releases of guessing.
      #
      # This settles it mechanically. Load the backend clean; tag every file
      # the way Windows tags a downloaded .zip; load it again; clear the tags;
      # load once more. If step 2 fails and step 3 passes, Mark of the Web is
      # PROVEN and so is the fix. If step 2 passes, the theory is dead and we
      # stop repeating it.
      - name: .NET backend loads (and survives Mark of the Web)
        shell: pwsh
        run: |
          $exe = "LED Raster Designer App\LED Raster Designer.exe"
          $env:LRD_SELFTEST = "1"

          # The app is built windowed (console=False), so `& $exe` returns
          # IMMEDIATELY and never sets $LASTEXITCODE - the first version of
          # this step raced its own subject and read an empty exit code as a
          # failure while the app was still starting. Start-Process -Wait
          # -PassThru is the only reliable way to get an exit code out of a
          # GUI-subsystem binary.
          function Invoke-SelfTest {
            $p = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow
            return $p.ExitCode
          }

          Write-Host "--- 1/3 clean bundle (baseline) ---"
          $clean = Invoke-SelfTest
          Write-Host "baseline exit: $clean"
          if ($clean -ne 0) {
            Write-Error "The .NET backend does not load even on a CLEAN bundle. That is a packaging fault, not Mark of the Web."
            exit 1
          }

          Write-Host "--- 2/3 every file tagged as downloaded-from-internet ---"
          # Alternate data streams are an NTFS feature. The runner workspace
          # lives on a temporary disk, so report the filesystem before drawing
          # any conclusion from a tag that would not not stick.
          $vol = (Get-Item "LED Raster Designer App").PSDrive.Name
          $fs = (Get-Volume -DriveLetter $vol -ErrorAction SilentlyContinue).FileSystemType
          Write-Host "workspace volume ${vol}: filesystem=$fs"

          $target = "LED Raster Designer App\_internal\pythonnet\runtime\Python.Runtime.dll"
          # Tag the ONE file the theory is about, and let the error SHOW.
          # Silencing it is how the last two runs produced an unreadable result.
          try {
            Set-Content -Path $target -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3" -ErrorAction Stop
            Write-Host "tagged $target"
          } catch {
            Write-Host "TAGGING FAILED: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }

          $probe = Get-Content -Path $target -Stream Zone.Identifier -ErrorAction SilentlyContinue
          Write-Host "Python.Runtime.dll zone tag now: $probe"
          if (-not $probe) {
            Write-Host "INCONCLUSIVE: this runner cannot carry a Zone.Identifier (filesystem=$fs), so the Mark of the Web theory can be neither proven nor refuted here. Baseline passed, so the bundle itself is sound. Not failing the build over an environment limitation."
            exit 0
          }

          # The rest of the bundle, now that tagging is known to work.
          Get-ChildItem -Recurse -File "LED Raster Designer App" |
            ForEach-Object {
              Set-Content -Path $_.FullName -Stream Zone.Identifier `
                          -Value "[ZoneTransfer]`nZoneId=3" -ErrorAction SilentlyContinue
            }
          $tagged = Invoke-SelfTest
          Write-Host "tagged exit: $tagged"

          Write-Host "--- 3/3 after the app clears the tags itself ---"
          $env:LRD_SELFTEST_CLEAR = "1"
          $cleared = Invoke-SelfTest
          Write-Host "cleared exit: $cleared"

          if ($tagged -ne 0 -and $cleared -eq 0) {
            Write-Host "PROVEN: Mark of the Web breaks the .NET backend, and clearing it fixes it."
          } elseif ($tagged -eq 0) {
            Write-Host "NOTE: a fully tagged bundle still loaded on this runner. Mark of the Web alone does NOT reproduce the reported failure here - do not present it as the diagnosis. The unblock step is harmless and stays, but the real cause is still open."
          } else {
            Write-Error "Tagging broke it and clearing did NOT fix it. The unblock fix is insufficient."
            exit 1
          }

      # ── Code Signing (requires certificate in secrets) ──
      - name: Sign executable
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          $cert = [System.Convert]::FromBase64String("$env:WINDOWS_CERTIFICATE")
          [System.IO.File]::WriteAllBytes("certificate.pfx", $cert)
          & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe' sign `
            /f certificate.pfx `
            /p "$env:WINDOWS_CERTIFICATE_PWD" `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            "LED Raster Designer App\LED Raster Designer.exe"
          Remove-Item certificate.pfx

      - name: Create release ZIP
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version -or $version -eq "${{ github.ref_name }}") {
            $version = "${{ github.event.inputs.version }}"
          }
          # The smoke tests above ran the app from this folder, and it wrote
          # its run-time files there. A .zip carrying .lrd-unblocked would
          # tell a fresh download it was already unblocked.
          foreach ($f in '.lrd-unblocked', 'launcher_crash.log') {
            Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path "LED Raster Designer App" $f)
          }
          Compress-Archive -Path "LED Raster Designer App" `
            -DestinationPath "led_raster_designer_v${version}_windows.zip"

      # ── Windows installer (Inno Setup, free) ──
      #
      # Inno Setup 6 ships on the windows-2022 and windows-2025 runner images
      # (6.7.1 as of image 20261101), so nothing is installed here. If an image
      # ever drops it, this step fails loudly instead of shipping a release with
      # no installer. The installer is unsigned, like the .exe and the .zip.
      #
      # Built from the same folder as the .zip (signed, when a certificate is
      # configured). The .iss leaves out the files the smoke tests above wrote
      # into that folder at run time.
      - name: Build Windows installer
        shell: pwsh
        run: |
          $label = "${{ github.ref_name }}".TrimStart('v')
          if (-not $label -or $label -eq "${{ github.ref_name }}") {
            $label = "${{ github.event.inputs.version }}"
          }
          $m = Select-String -Path src\VERSION.txt -Pattern '^v(\d+\.\d+\.\d+)\b' | Select-Object -First 1
          if (-not $m) { Write-Error "no version entry at the top of src/VERSION.txt"; exit 1 }
          $numeric = $m.Matches[0].Groups[1].Value
          if ($label.Split('-')[0] -ne $numeric) {
            Write-Error "Building $label but src/VERSION.txt's top entry is v$numeric."
            exit 1
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup 6 (ISCC.exe) is not on this runner image. Add a pinned install step."
            exit 1
          }
          Write-Host "ISCC: $iscc ($((Get-Item $iscc).VersionInfo.ProductVersion))"
          $bundle = (Resolve-Path "LED Raster Designer App").Path
          $out = Join-Path $PWD "installer-out"
          & $iscc "/DAppVersion=$label" "/DAppNumericVersion=$numeric" "/DBundleDir=$bundle" "/O$out" build\led_raster_designer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed ($LASTEXITCODE)"; exit 1 }
          # An older build of the same app, for the upgrade test below.
          $old = Join-Path $env:RUNNER_TEMP "installer-old"
          & $iscc "/DAppVersion=0.0.1" "/DAppNumericVersion=0.0.1" "/DBundleDir=$bundle" "/DSmokeFastBuild" "/O$old" build\led_raster_designer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC (upgrade test build) failed ($LASTEXITCODE)"; exit 1 }
          $setup = "led_raster_designer_v${label}_windows_setup.exe"
          Move-Item (Join-Path $out $setup) $setup
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Built $setup ($mb MB)"
          "LRD_SETUP=$((Resolve-Path $setup).Path)" >> $env:GITHUB_ENV
          "LRD_SETUP_OLD=$(Join-Path $old 'led_raster_designer_v0.0.1_windows_setup.exe')" >> $env:GITHUB_ENV
          "LRD_SETUP_LABEL=$label" >> $env:GITHUB_ENV

      # Install the way a user does, prove the installed app runs, upgrade
      # over an older install WHILE it runs, then uninstall, and check the
      # user's data outlived all of it. Any failed check fails the build.
      - name: Smoke test the installer (install, upgrade, run, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appName = 'LED Raster Designer'
          $appId = '{7D7BC445-209D-4629-A5D7-1C0B7EDC0C94}'
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\${appId}_is1"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\$appName"
          $exe = Join-Path $installDir "$appName.exe"
          $startLnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\$appName.lnk"
          $desktopLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "$appName.lnk"
          $dataDir = Join-Path $env:LOCALAPPDATA $appName
          $configDir = Join-Path $env:APPDATA $appName
          $port = 18760
          $base = "http://127.0.0.1:$port"
          $script:failed = $false

          function Check($ok, $what) {
            if ($ok) { Write-Host "  ok: $what" }
            else { Write-Host "::error::FAILED: $what"; $script:failed = $true }
          }
          function Stop-IfFailed {
            if ($script:failed) { Get-Process -Name $appName -ErrorAction SilentlyContinue | Stop-Process -Force; exit 1 }
          }
          function Run-Setup($file, [string[]]$extra) {
            $log = Join-Path $env:RUNNER_TEMP ("setup-" + [IO.Path]::GetFileNameWithoutExtension($file) + ".log")
            $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', "/LOG=$log") + $extra
            $p = Start-Process -FilePath $file -ArgumentList $setupArgs -Wait -PassThru
            Write-Host "  setup exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40 | Out-Host }
            return $p.ExitCode
          }
          function Start-App {
            $env:LRD_NO_WINDOW = '1'
            $env:LRD_SMOKE_PORT = "$port"
            $p = Start-Process -FilePath $exe -PassThru
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 1
              try {
                if ((Invoke-WebRequest -UseBasicParsing -Uri "$base/api/version" -TimeoutSec 2).StatusCode -eq 200) { return $p }
              } catch { }
              if ($p.HasExited) { break }
            }
            Write-Host "::error::the installed app never answered on $base"
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 1
          }
          function Answers {
            try { return (Invoke-WebRequest -UseBasicParsing -Uri "$base/api/version" -TimeoutSec 2).StatusCode -eq 200 } catch { return $false }
          }

          Write-Host "--- 1. install an older version ---"
          Check ((Run-Setup $env:LRD_SETUP_OLD @()) -eq 0) 'older setup ran'
          Check (Test-Path $exe) "installed to $installDir"
          Check ((Get-ItemProperty $uninstKey -ErrorAction SilentlyContinue).DisplayVersion -eq '0.0.1') 'Settings > Apps lists 0.0.1'
          Stop-IfFailed

          Write-Host "--- 2. run it and give it some user data ---"
          $old = Start-App
          Check $true "installed app answers ($((Invoke-WebRequest -UseBasicParsing -Uri "$base/api/version").Content))"
          $body = @{ data = @{ columns = 2; rows = 2 } } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri "$base/api/presets/installer-smoke" -Body $body -ContentType 'application/json' | Out-Null
          New-Item -ItemType Directory -Force $configDir | Out-Null
          $settingsFile = Join-Path $configDir 'settings.json'
          $settings = @{}
          if (Test-Path $settingsFile) {
            (Get-Content $settingsFile -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $settings[$_.Name] = $_.Value }
          }
          $settings['installer_smoke'] = $true
          $settings | ConvertTo-Json | Set-Content $settingsFile -Encoding utf8
          $presetFile = Join-Path $dataDir 'presets\installer-smoke.json'
          Check (Test-Path $presetFile) 'the app saved a preset to the user data folder'
          Check (-not (Test-Path (Join-Path $installDir 'presets'))) 'nothing written into the install folder'
          Stop-IfFailed

          Write-Host "--- 3. upgrade over it while it is running ---"
          Check ((Run-Setup $env:LRD_SETUP @('/MERGETASKS=desktopicon')) -eq 0) 'new setup ran over the running copy'
          Start-Sleep -Seconds 2
          $old.Refresh()
          Check $old.HasExited 'setup closed the running copy'
          Check (-not (Answers)) 'the old server is gone'
          Check ((Get-ItemProperty $uninstKey).DisplayVersion -eq $env:LRD_SETUP_LABEL) "Settings > Apps now lists $env:LRD_SETUP_LABEL"
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq $appName })
          Check ($entries.Count -eq 1) "exactly one Settings > Apps entry (found $($entries.Count))"
          $u = Get-ItemProperty $uninstKey
          Check ($u.UninstallString -and (Test-Path ($u.UninstallString.Trim('"')))) "uninstaller exists: $($u.UninstallString)"
          Check ($u.DisplayIcon -like "*$appName.exe*") "entry has the app icon: $($u.DisplayIcon)"
          $shell = New-Object -ComObject WScript.Shell
          Check ((Test-Path $startLnk) -and $shell.CreateShortcut($startLnk).TargetPath -eq $exe) "Start menu shortcut opens $exe"
          Check ((Test-Path $desktopLnk) -and $shell.CreateShortcut($desktopLnk).TargetPath -eq $exe) 'desktop shortcut opens the app'
          Stop-IfFailed

          Write-Host "--- 4. the upgraded app runs and still has the user's data ---"
          $new = Start-App
          $presets = (Invoke-RestMethod -Uri "$base/api/presets").presets
          Check ($presets -contains 'installer-smoke') 'the preset saved before the upgrade is still there'
          Check (((Invoke-WebRequest -UseBasicParsing -Uri "$base/").StatusCode) -eq 200) 'the app page loads'
          Stop-IfFailed

          Write-Host "--- 5. uninstall while it is running ---"
          $un = $u.UninstallString.Trim('"')
          $p = Start-Process -FilePath $un -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Write-Host "  uninstaller exit code: $($p.ExitCode)"
          # The uninstaller hands off to a copy of itself in TEMP; wait for it.
          foreach ($i in 1..60) {
            if (-not (Test-Path $uninstKey) -and -not (Test-Path $exe)) { break }
            Start-Sleep -Seconds 1
          }
          $new.Refresh()
          Check $new.HasExited 'uninstall closed the running copy'
          Check (-not (Test-Path $uninstKey)) 'Settings > Apps entry removed'
          Check (-not (Test-Path $exe)) 'app removed'
          Check (-not (Test-Path $installDir)) 'install folder removed'
          Check (-not (Test-Path $startLnk)) 'Start menu shortcut removed'
          Check (-not (Test-Path $desktopLnk)) 'desktop shortcut removed'

          Write-Host "--- 6. the user's data is still there ---"
          Check (Test-Path $presetFile) "preset kept: $presetFile"
          Check ((Get-Content $settingsFile -Raw) -match 'installer_smoke') "settings kept: $settingsFile"
          Check (Test-Path (Join-Path $dataDir 'logs\led_raster_designer.log')) 'logs kept'
          Stop-IfFailed
          Write-Host "Installer smoke test passed."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          # The .zip ships beside the installer for one release (1.7.0) so
          # anyone mid-show can still run it unzipped; drop it after that.
          path: |
            led_raster_designer_v*_windows.zip
            led_raster_designer_v*_windows_setup.exe

  # ──────────────────────────────────────────────
  # Create GitHub Release & Upload Assets
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum macos-build/*.dmg windows-build/*.zip windows-build/*_windows_setup.exe > checksums.txt
          cat checksums.txt

      # The release body is BUILT from src/VERSION.txt, never hand-maintained.
      # A checked-in RELEASE_NOTES.md only moved the rot: forget to regenerate
      # it and the release ships the previous version's text, silently. This
      # also FAILS THE BUILD if VERSION.txt's top entry is not the tag being
      # released, which is the mistake worth catching before publish.
      - name: Build release notes from VERSION.txt
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --out RELEASE_NOTES.md
          echo "──────── release body ────────"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "LED Raster Designer ${{ github.ref_name }}"
          # Auto-publish on tag push so the README "Download latest" link
          # and the in-app sidebar link always resolve to the just-built
          # release. Previously this was draft:true and required manual
          # publish, which led to releases piling up as drafts and the
          # /releases/latest page pointing at an old version.
          draft: false
          # A -beta tag publishes as a PRERELEASE and never becomes
          # "latest": the README download link and the in-app update check
          # both resolve /releases/latest, and a beta shared for testing
          # must not be what every user is steered to.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          make_latest: ${{ contains(github.ref_name, '-beta') && 'false' || 'true' }}
          # Was generate_release_notes: true, which builds the body from the
          # COMMIT LIST and threw away the notes written for users. The body
          # now comes from RELEASE_NOTES.md, generated above from VERSION.txt.
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/macos-build/*.dmg
            artifacts/windows-build/*.zip
            artifacts/windows-build/*_windows_setup.exe
            artifacts/checksums.txt

